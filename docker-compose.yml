version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: carboniq-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: carboniq
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: carboniq-ml-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - CLIMATIQ_API_KEY=${CLIMATIQ_API_KEY:-}
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: carboniq-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/carboniq
      - JWT_SECRET=${JWT_SECRET:-carboniq-super-secret-docker-production-key-2026}
      - ML_SERVICE_URL=http://ml-service:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLIMATIQ_API_KEY=${CLIMATIQ_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    volumes:
      - ./storage:/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carboniq-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend-node

volumes:
  mongo_data:
    driver: local
